name: Debian package

on:
  pull_request:
    paths:
      - 'debian/**'
      - '.github/workflows/debian-package.yml'
      - 'yaklock'
      - 'io.github.bjroberson.yaklock.desktop'
      - 'icons/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper desktop-file-utils

      - name: Build and inspect package
        run: |
          dpkg-buildpackage -us -uc -b
          package="yaklock_$(dpkg-parsechangelog -SVersion)_all.deb"
          mkdir -p artifacts
          cp "../$package" artifacts/
          dpkg-deb --info "artifacts/$package"
          dpkg-deb --contents "artifacts/$package"
          root=$(mktemp -d)
          dpkg-deb --extract "artifacts/$package" "$root"
          test -x "$root/usr/bin/yaklock"
          cmp yaklock "$root/usr/bin/yaklock"
          desktop-file-validate "$root/usr/share/applications/io.github.bjroberson.yaklock.desktop"
          diff -r icons/hicolor "$root/usr/share/icons/hicolor"
          cd artifacts
          sha256sum "$package" > SHA256SUMS

      - name: Upload package and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yaklock-debian-package
          path: artifacts/
          if-no-files-found: error
